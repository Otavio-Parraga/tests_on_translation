# AUTO-GENERATED by config/generate_loss_combo_configs.py — do not edit by hand.
# Compound-loss sweep: translator=flow  losses=mse+info_nce  token=last
# Shared FineWeb split (sample-10BT, seed 42, limit 30000); reuses data/fineweb activation caches.

batch_size = 32   # activation-extraction batch size

[source_model]
name = "meta-llama/Llama-3.2-1B-Instruct"
layer = 8
module = "residual"
token_position = -1

[target_model]
name = "meta-llama/Llama-3.2-3B-Instruct"
layer = 8
module = "residual"
token_position = -1

[dataset]
name = "FINEWEB"
behaviors = []          # unused for FINEWEB
split = "train"         # "train"/"generate" -> 80% ; "test" -> 20% (seed 42, doc-level)
data_root = ""          # unused for FINEWEB; subset fixed to fineweb-edu/sample-10BT
limit = 30000

[translator]
type = "flow"
num_blocks = 8           # stacked [ActNorm -> mixing -> AffineCoupling] blocks
