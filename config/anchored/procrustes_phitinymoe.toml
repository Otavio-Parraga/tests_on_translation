# AUTO-GENERATED by config/generate_anchored_configs.py — do not edit by hand.
# Stage A of the anchored-translator study: the closed-form orthogonal Procrustes
# FLOOR for meta-llama/Llama-3.2-1B-Instruct l8 -> microsoft/Phi-tiny-MoE-instruct.
# cross-family sparse MoE, 2048 -> 4096. CAVEAT: the tree has native CAA SVs for this model at layer 8 / myopic-reward ONLY, and no cached Phi l8 activations, so this pair cannot be scored against native SVs at all — it is judged on held-out reconstruction only, at the mid-depth layer (l16 = 50% of 32 layers).
#
# `layer` below is a placeholder — fit every cached target layer by overriding it:
#   for k in 10 12 14 16 18 20 22; do
#     conda run -n acteng python fit_procrustes.py \
#       --config config/anchored/procrustes_phitinymoe.toml --source-layer 8 --target-layer $k
#   done
#
# normalize_activations = false: an orthogonal map is norm/inner-product
# preserving, so it must see RAW activations; L2-normalizing first would distort
# exactly the geometry the map exists to preserve. The trained configs in this
# directory match it, so the floor and the trained runs are finally comparable.

batch_size = 16   # activation-extraction batch size

[source_model]
name = "meta-llama/Llama-3.2-1B-Instruct"
layer = 8
module = "residual"
token_position = -1

[target_model]
name = "microsoft/Phi-tiny-MoE-instruct"
layer = 10
module = "residual"
token_position = -1

[dataset]
name = "FINEWEB"
behaviors = []          # unused for FINEWEB
split = "train"         # "train"/"generate" -> 80% ; "test" -> 20% (seed 42, doc-level)
data_root = ""          # unused for FINEWEB; subset fixed to fineweb-edu/sample-10BT
limit = 30000

[translator]
type = "linear"
bias = true

[training]
data_dir = "data/fineweb"        # sentences.json + activation caches (shared, read-only)
output_dir = "outputs/anchored"    # Procrustes baselines land beside the trained runs
seed = 42
train_ratio = 0.8
normalize_activations = false     # RAW activations — see header
