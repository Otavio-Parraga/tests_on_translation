# AUTO-GENERATED by config/generate_anchored_configs.py — do not edit by hand.
# Stage B of the anchored-translator study: ANCHORED on the frozen closed-form Procrustes map (y = W x + b + gate * mlp(x)).
# meta-llama/Llama-3.2-1B-Instruct l8 -> Qwen/Qwen2.5-0.5B-Instruct l14, mlp, losses=cosine+info_nce.
#
# Target layer 14 comes from Stage A (see TRAIN_LAYERS in the generator).
# The anchored and from-scratch checkpoints differ only in [translator].anchor and
# land in separate files (mlp+procrustes), so they are a clean pair.
#
# normalize_activations = false, unlike the historical trained sweeps: cosine and
# info_nce are both scale-invariant, and raw activations put this run in the SAME
# preprocessing as the Procrustes baseline it is being compared to (the old
# comparison confounded architecture with preprocessing). It is also required for
# the anchored variant — an anchor fitted on L2-normalized rows is not the floor.

batch_size = 32   # activation-extraction batch size

[source_model]
name = "meta-llama/Llama-3.2-1B-Instruct"
layer = 8
module = "residual"
token_position = -1

[target_model]
name = "Qwen/Qwen2.5-0.5B-Instruct"
layer = 14
module = "residual"
token_position = -1

[dataset]
name = "FINEWEB"
behaviors = []          # unused for FINEWEB
split = "train"         # "train"/"generate" -> 80% ; "test" -> 20% (seed 42, doc-level)
data_root = ""          # unused for FINEWEB; subset fixed to fineweb-edu/sample-10BT
limit = 30000

[translator]
type = "mlp"
hidden_dims = [2048, 2048, 2048]
dropout = 0.1
activation = "gelu"
use_residual = false
anchor = "procrustes"    # frozen closed-form anchor; gate starts at 0,
                         # so the run STARTS at the Procrustes floor and can
                         # only add what the orthogonal map misses
gate_init = 0.0

[training]
epochs = 1000
batch_size = 2048
lr = 1e-4
weight_decay = 1e-4
train_ratio = 0.8
seed = 42
output_dir = "outputs/anchored"    # keeps this study out of outputs/fineweb's A/B globs
data_dir = "data/fineweb"        # sentences.json + activation caches (shared, read-only)
normalize_activations = false     # RAW — see header
losses = ["cosine", "info_nce"]
loss_weights = [1.0, 1.0]
temperature = 0.1
grad_clip = 1.0
lr_warmup_epochs = 10
early_stopping_patience = 50
early_stopping_min_delta = 1e-4
