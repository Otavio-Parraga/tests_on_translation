batch_size = 32

[source_model]
name = "meta-llama/Llama-3.2-1B-Instruct"
layer = 8
module = "residual"
token_position = -1

[target_model]
name = "google/gemma-3-1B-it"
layer = 8
module = "residual"
token_position = -1

[dataset]
name = "GENERATED"
data_root = "data/generated_15k/sentences.json"

[translator]
type = "mlp"
hidden_dims = [2048, 2048, 2048]
dropout = 0.1
activation = "gelu"
use_residual = false
d_model = 512
nhead = 8
num_layers = 4

[training]
epochs = 1000
batch_size = 2048
lr = 1e-4
weight_decay = 1e-4
train_ratio = 0.8
seed = 42
output_dir = "outputs/generated_15k"   # translator checkpoints + tensorboard logs
data_dir = "data/generated_15k"        # sentences.json + activation caches
normalize_activations = true
losses = ["cosine"]
loss_weights = [1.0]
temperature = 0.1
grad_clip = 1.0
lr_warmup_epochs = 10
