# Reversible (normalizing-flow) translator between both Llama models on the 30k sentence set:
#   Llama-3.2-1B src (2048) <-> Llama-3.2-3B trg (3072)
# A single trained flow maps source->target (forward) AND target->source
# (inverse). The flow runs in D = max(src_dim, trg_dim); the shorter side is
# zero-padded in and the extra "auxiliary" dims are dropped out, so invertibility
# is exact in the padded D-space. Source activations are reused from the 30k
# cache; only the flow translator is new.

batch_size = 8   # extraction batch size (3B lm_head OOMs at 32 on 11 GB GPU)

[source_model]
name = "meta-llama/Llama-3.2-1B-Instruct"
layer = 8
module = "residual"
token_position = -1

[target_model]
name = "meta-llama/Llama-3.2-3B-Instruct"
layer = 8
module = "residual"
token_position = -1

[dataset]
name = "GENERATED"
data_root = "data/generated_30k/sentences.json"

[translator]
type = "flow"
num_blocks = 8           # stacked [ActNorm -> mixing -> AffineCoupling] blocks
coupling_hidden = 1024   # hidden width of each coupling conditioner MLP
activation = "gelu"
mixing = "permutation"   # "permutation" (stable, O(D) inverse) | "inv1x1" (Glow, can blow up at large D)

[training]
epochs = 1000
batch_size = 2048
lr = 1e-4
weight_decay = 1e-4
train_ratio = 0.8
seed = 42
output_dir = "outputs/generated_30k"   # translator checkpoints + tensorboard logs
data_dir = "data/generated_30k"        # sentences.json + activation caches
normalize_activations = true
# Activations are L2-normalized, so the flow's output magnitude is meaningless;
# cosine optimizes direction directly and keeps gradients bounded (MSE here blows
# up on the ~sqrt(D) scale gap between the flow output and the unit-norm target).
losses = ["cosine"]
loss_weights = [1.0]
temperature = 0.1
grad_clip = 1.0
lr_warmup_epochs = 10
# Early stopping on validation loss: stop after `patience` epochs with no
# improvement of at least `min_delta`. 0 patience disables it.
early_stopping_patience = 50
early_stopping_min_delta = 1e-4
# Reversible-only: weight on the target->source (inverse) reconstruction loss.
# 0.0 trains forward only; ~1.0 trains both directions from the one flow.
inverse_loss_weight = 1.0
