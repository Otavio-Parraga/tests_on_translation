# Cross-ARCHITECTURE translation target: Llama-3.2-1B (source) -> LLaDA2.0-mini (target).
# Mirror of config/new_models/fineweb_llada8b.toml with the target swapped to LLaDA's
# newer sparse-MoE generation, for the "translating an SV into a non-autoregressive
# MoE model" study.
#
# inclusionAI/LLaDA2.0-mini: LLaDA2MoeModelLM (llada2_moe), 20 decoder layers,
# hidden_size 2048, 256 experts / 8 active + 1 shared per token (16B total, ~1.4B
# active), bidirectional block-diffusion attention, no KV cache in the sense this
# repo uses it. Ships custom modeling code (trust_remote_code=True, already
# always-on in utils/hf.py); two of the same guarded compatibility shims added for
# LLaDA-8B-Instruct apply here too (all_tied_weights_keys / old tie_weights()
# signature; ROPE_INIT_FUNCTIONS["default"] restored — see utils/hf.py). Its decoder
# layers already sit at the standard model.model.layers path, so get_layer() needed
# no new branch for this one.
#
# One LLaDA2.0-specific requirement: forward() rejects a plain (B,T) padding mask —
# it requires a pre-built (B,1,T,T) block-diffusion attention bias (see its own
# generate()'s torch.tril(...).log() construction). A guarded shim in utils/hf.py
# (gated on config.model_type == "llada2_moe") builds this from the ordinary 2D
# mask for the single clean/unmasked-sentence forward pass extraction always uses —
# collapsing to full bidirectional attention over real (non-pad) tokens, matching
# the single-block case of the model's own convention.
#
# token_position = "mean": same reasoning as fineweb_llada8b.toml — bidirectional
# attention removes any privileged "last token" position, so mean-pooling over
# non-pad tokens (already-existing pooling mode, dataset.py) is the principled
# extraction choice.
#
# Layer sweep (this study): target layers {6,8,10,12,14} = middle third (30%-70%
# depth of 20 layers), mirroring the relative depth used for gemma-3-1B {8..18}
# (26 layers) and Llama-3B {8..18} (28 layers).
#
# Extract activations across the sweep (network-free, reuses data/fineweb/sentences.json):
#   CUDA_VISIBLE_DEVICES=2 conda run -p /mnt/C-SSD/parraga/conda_envs/act_eng python extract_activations_sweep.py \
#     --config config/new_models/fineweb_llada2mini.toml --layers 6 8 10 12 14
#
# Peak GPU memory observed loading + one forward pass on an A6000 (48GB): ~33GB
# (16B total params dominate even though only ~1.4B are active per token — every
# expert's weights are resident regardless of routing).
#
# normalize_activations = false: the closed-form orthogonal Procrustes map is
# norm/inner-product preserving, so activations are fed RAW. The map here changes
# dimension 2048 -> 2048 (same width as the source, still a different space).

batch_size = 8    # activation-extraction batch size (16B total params resident on GPU -> less headroom than the 8B dense target)

[source_model]
name = "meta-llama/Llama-3.2-1B-Instruct"
layer = 8
module = "residual"
token_position = -1

[target_model]
name = "inclusionAI/LLaDA2.0-mini"
layer = 10                # default; overridden per-layer on the CLI
module = "residual"
token_position = "mean"

[dataset]
name = "FINEWEB"
behaviors = []          # unused for FINEWEB
split = "train"         # "train"/"generate" -> 80% ; "test" -> 20% (seed 42, doc-level)
data_root = ""          # unused for FINEWEB; subset fixed to fineweb-edu/sample-10BT
limit = 30000

[translator]
type = "linear"
bias = true

[training]
data_dir = "data/fineweb"            # sentences.json + activation caches (shared)
output_dir = "outputs/new_models"    # Procrustes checkpoint output (fit later)
seed = 42
train_ratio = 0.8
normalize_activations = false        # RAW activations — see header
