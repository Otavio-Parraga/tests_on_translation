# Cross-ARCHITECTURE translation target: Llama-3.2-1B (source) -> Gemma-3-1B (target).
# Mirror of config/fineweb/linear_procrustes_raw.toml with the target model swapped
# to a different family, for the "other models for translation" study.
#
# gemma-3-1B-it: Gemma3ForCausalLM (gemma3_text), 26 decoder layers, hidden_size 1152.
# Layer sweep (this study): target layers {8,10,12,14,16,18} = middle third (31%-69% depth),
# centered on l13 (50%), mirroring the density used for Llama-3B {8..18}.
#
# Extract activations across the sweep (network-free, reuses data/fineweb/sentences.json):
#   conda run -n acteng python extract_activations_sweep.py \
#     --config config/new_models/fineweb_gemma1b.toml --layers 8 10 12 14 16 18
#
# normalize_activations = false: the closed-form orthogonal Procrustes map is
# norm/inner-product preserving, so activations are fed RAW (see the forward
# config's header). The map here changes dimension 2048 -> 1152.
#
# NOTE: Gemma residual activations have a very large scale (see the prior
# gemma-residual-scale finding); RAW Procrustes is the correct choice here since
# it preserves that geometry rather than collapsing it.

batch_size = 32   # activation-extraction batch size

[source_model]
name = "meta-llama/Llama-3.2-1B-Instruct"
layer = 8
module = "residual"
token_position = -1

[target_model]
name = "google/gemma-3-1B-it"
layer = 13                # default; overridden per-layer on the CLI
module = "residual"
token_position = -1

[dataset]
name = "FINEWEB"
behaviors = []          # unused for FINEWEB
split = "train"         # "train"/"generate" -> 80% ; "test" -> 20% (seed 42, doc-level)
data_root = ""          # unused for FINEWEB; subset fixed to fineweb-edu/sample-10BT
limit = 30000

[translator]
type = "linear"
bias = true

[training]
data_dir = "data/fineweb"            # sentences.json + activation caches (shared)
output_dir = "outputs/new_models"    # Procrustes checkpoint output (fit later)
seed = 42
train_ratio = 0.8
normalize_activations = false        # RAW activations — see header
