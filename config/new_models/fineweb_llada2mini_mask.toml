# Cross-ARCHITECTURE translation target: Llama-3.2-1B (source) -> LLaDA2.0-mini (target),
# extracting at an appended [MASK] position instead of mean-pooling.
#
# This is the MASK-POSITION arm for the MoE diffusion target. Identical to
# config/new_models/fineweb_llada2mini.toml except the target's token_position, so the
# two form a controlled comparison of *where* to read the representation. See that
# file's header for the model description, the utils/hf.py compatibility shims, and
# the (B,1,T,T) block-attention-bias requirement — all of it applies unchanged.
#
# token_position = "mask": append one [MASK] token after the sentence and read the
# hidden state there. Rationale in full is in fineweb_llada8b_mask.toml's header;
# in short, mean-pooling describes text that already exists, while a steering vector
# is applied mid-denoising where the sequence is mostly [MASK] — the mask position is
# the only slot the model was trained to fill, and it is where the A/B eval reads.
#
# ONE MODEL-SPECIFIC NOTE: this model exposes its mask token in the OPPOSITE place
# from LLaDA-8B — here it is on the tokenizer ('<|mask|>' = 156895, matching the
# mask_id default in the model's own generate() signature) and there is no
# config.mask_token_id at all, whereas the 8B has only the config field and no
# tokenizer mask_token. resolve_mask_token_id() in utils/hf.py checks both, which is
# exactly why it cannot be a one-line accessor.
#
# The appended mask flows through the block-attention shim unchanged: the widened 2D
# padding mask is what gets converted to the (B,1,T+1,T+1) bias, so the mask position
# is attended by (and attends to) every real token.
#
# CACHE NAMING: caches land as LLaDA2.0-mini_l{N}_mask.pt (POOLING_SUFFIXES in
# utils/paths.py), coexisting with the _mean arm. Load-bearing — extraction skips a
# cache whose n_sentences matches, so a shared slug would silently reuse the mean
# activations instead of extracting.
#
# Layer sweep: {6,8,10,12,14}, identical to the mean arm for layer-for-layer comparison.
#
# Extract activations across the sweep (network-free, reuses data/fineweb/sentences.json):
#   CUDA_VISIBLE_DEVICES=2 conda run -p /mnt/C-SSD/parraga/conda_envs/act_eng python extract_activations_sweep.py \
#     --config config/new_models/fineweb_llada2mini_mask.toml --layers 6 8 10 12 14
#
# Peak GPU memory: ~33GB, same as the mean arm. Do NOT run concurrently with the 8B
# sweep on one 48GB card. Model load is also slow here (~14.8k weight tensors per
# load, reloaded per layer) — budget ~15-25 min of pure loading across the 5 layers.
#
# normalize_activations = false: the closed-form orthogonal Procrustes map is
# norm/inner-product preserving, so activations are fed RAW. The map here changes
# dimension 2048 -> 2048 (same width as the source, still a different space).

batch_size = 8    # matches the mean arm so the two runs are comparable

[source_model]
name = "meta-llama/Llama-3.2-1B-Instruct"
layer = 8
module = "residual"
# Stays -1: Llama is causal and has no mask token, so "mask" is meaningless on the
# source side. Reusing the existing Llama-3.2-1B-Instruct_l8.pt cache also means this
# arm costs only target extraction.
token_position = -1

[target_model]
name = "inclusionAI/LLaDA2.0-mini"
layer = 10                # default; overridden per-layer on the CLI
module = "residual"
token_position = "mask"   # see header — the appended [MASK] readout

[dataset]
name = "FINEWEB"
behaviors = []          # unused for FINEWEB
split = "train"         # "train"/"generate" -> 80% ; "test" -> 20% (seed 42, doc-level)
data_root = ""          # unused for FINEWEB; subset fixed to fineweb-edu/sample-10BT
limit = 30000

[translator]
type = "linear"
bias = true

[training]
data_dir = "data/fineweb"            # sentences.json + activation caches (shared)
output_dir = "outputs/new_models"    # Procrustes checkpoint output (fit later)
seed = 42
train_ratio = 0.8
normalize_activations = false        # RAW activations — see header
