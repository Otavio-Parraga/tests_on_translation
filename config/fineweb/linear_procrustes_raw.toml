# HAND-MAINTAINED config — NOT auto-generated by config/generate_fineweb_configs.py.
# It is not regenerated or clobbered by the generator, so edit it here by hand.
# Used ONLY by fit_procrustes.py to fit the closed-form orthogonal Procrustes
# "floor" baseline. It is NOT used by train.py — the gradient-trained translators
# use the auto-generated *_{loss}_{pooling}.toml configs (which set
# normalize_activations = true).
#
# Fit with:
#   conda run -n acteng python fit_procrustes.py --config config/fineweb/linear_procrustes_raw.toml
#
# WHY normalize_activations = false here: fit_orthogonal_procrustes yields a
# norm/inner-product-preserving map, so activations must be fed RAW (un-normalized)
# to keep that geometry faithful. L2-normalizing first (as the trained configs do)
# would distort exactly the geometry the orthogonal map exists to preserve, defeating
# the point of the floor baseline.
#
# Llama-3.2-1B-Instruct l8 residual -> Llama-3.2-3B-Instruct l8 residual, last token.

batch_size = 32   # activation-extraction batch size

[source_model]
name = "meta-llama/Llama-3.2-1B-Instruct"
layer = 8
module = "residual"
token_position = -1

[target_model]
name = "meta-llama/Llama-3.2-3B-Instruct"
layer = 8
module = "residual"
token_position = -1

[dataset]
name = "FINEWEB"
behaviors = []          # unused for FINEWEB
split = "train"         # "train"/"generate" -> 80% ; "test" -> 20% (seed 42, doc-level)
data_root = ""          # unused for FINEWEB; subset fixed to fineweb-edu/sample-10BT
limit = 30000

[translator]
type = "linear"
bias = true

[training]
data_dir = "data/fineweb"        # sentences.json + activation caches (shared by all 24)
output_dir = "outputs/fineweb"   # Procrustes checkpoint output
seed = 42
train_ratio = 0.8
normalize_activations = false    # RAW activations — see header; do NOT set true here
