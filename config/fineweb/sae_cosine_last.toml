module = "residual"
token_position = -1

[target_model]
name = "meta-llama/Llama-3.2-3B-Instruct"
layer = 8
module = "residual"
token_position = -1

[dataset]
name = "FINEWEB"
behaviors = []          # unused for FINEWEB
split = "train"         # "train"/"generate" -> 80% ; "test" -> 20% (seed 42, doc-level)
