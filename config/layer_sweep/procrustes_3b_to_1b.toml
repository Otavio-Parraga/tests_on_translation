# REVERSED-DIRECTION Procrustes config: Llama-3.2-3B (source) -> Llama-3.2-1B (target).
# Mirror of config/fineweb/linear_procrustes_raw.toml with the model roles swapped,
# for the layer-transfer study (Task 2). Used ONLY by fit_procrustes.py.
#
# Fit (layers overridden on the CLI), e.g. 3B layer 14 -> 1B layer 8:
#   conda run -n acteng python fit_procrustes.py \
#     --config config/layer_sweep/procrustes_3b_to_1b.toml \
#     --source-layer 14 --target-layer 8 \
#     --output outputs/layer_sweep/task2/best_translator__Llama-3.2-3B-Instruct_l14__Llama-3.2-1B-Instruct_l8__linear__procrustes.pt
#
# normalize_activations = false: the orthogonal Procrustes map is norm/inner-product
# preserving, so activations must be fed RAW (see the forward config's header). Here
# the map REDUCES dimension (3072 -> 2048); fit_orthogonal_procrustes handles this via
# the thin SVD, yielding a semi-orthogonal W with orthonormal ROWS (W W^T = I_2048).
# Activation caches are keyed by (model, layer) regardless of source/target role, so
# this config reuses the same data/fineweb caches the forward experiments extracted.

batch_size = 32

[source_model]
name = "meta-llama/Llama-3.2-3B-Instruct"
layer = 14
module = "residual"
token_position = -1

[target_model]
name = "meta-llama/Llama-3.2-1B-Instruct"
layer = 8
module = "residual"
token_position = -1

[dataset]
name = "FINEWEB"
behaviors = []
split = "train"
data_root = ""
limit = 30000

[translator]
type = "linear"
bias = true

[training]
data_dir = "data/fineweb"
output_dir = "outputs/layer_sweep/task2"
seed = 42
train_ratio = 0.8
normalize_activations = false
